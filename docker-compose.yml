name: creatorpay
x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "3"
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *json-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CreatorPayV2Db}
      POSTGRES_USER: ${POSTGRES_USER:-creatorpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [creatorpay-postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: src/CreatorPay.Api/Dockerfile }
    restart: unless-stopped
    logging: *json-logging
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__CreatorPayDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-CreatorPayV2Db};Username=${POSTGRES_USER:-creatorpay};Password=${POSTGRES_PASSWORD}
      Authentication__Jwt__Issuer: ${Authentication__Jwt__Issuer:-CreatorPay}
      Authentication__Jwt__Audience: ${Authentication__Jwt__Audience:-CreatorPay.Web}
      Authentication__Jwt__SigningKey: ${Authentication__Jwt__SigningKey:?Set JWT signing key}
      CustomerVerification__HmacSecret: ${CustomerVerification__HmacSecret:?Set HMAC secret}
      CustomerVerification__EncryptionKey: ${CustomerVerification__EncryptionKey:?Set encryption key}
      DepositProofStorage__RootPath: /app/data/deposit-proofs
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:8081}
      StaffInvitations__WebBaseUrl: ${WEB_ORIGIN:-http://localhost:8081}
      PublicAppBaseUrl: ${PUBLIC_APP_BASE_URL:-http://localhost:8081}
      FirebaseAuth__Enabled: ${FirebaseAuth__Enabled:-false}
      FirebaseAuth__ProjectId: ${FirebaseAuth__ProjectId:-}
      FirebaseAuth__ServiceAccountPath: ${FirebaseAuth__ServiceAccountPath:-}
      FirebaseAuth__AuthorizedOrigin: ${FirebaseAuth__AuthorizedOrigin:-https://pilot.weymela.com}
      FirebaseAuth__CallbackPath: ${FirebaseAuth__CallbackPath:-/auth/firebase-action}
      FirebaseAuth__PinResetAuthorizationMinutes: ${FirebaseAuth__PinResetAuthorizationMinutes:-10}
      FirebaseMessaging__Enabled: ${FirebaseMessaging__Enabled:-false}
      FirebaseMessaging__ProjectId: ${FirebaseMessaging__ProjectId:-}
      FirebaseMessaging__ServiceAccountPath: ${FirebaseMessaging__ServiceAccountPath:-}
    volumes: [creatorpay-deposit-proofs:/app/data/deposit-proofs, creatorpay-data-protection-keys:/app/data/data-protection-keys]
    ports: ["${API_PORT:-8080}:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [backend, edge]
    healthcheck: { test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/live || exit 1"], interval: 15s, timeout: 5s, retries: 5 }
  worker:
    build: { context: ., dockerfile: src/CreatorPay.Worker/Dockerfile }
    restart: unless-stopped
    logging: *json-logging
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__CreatorPayDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-CreatorPayV2Db};Username=${POSTGRES_USER:-creatorpay};Password=${POSTGRES_PASSWORD}
      BackgroundWorkers__HealthFilePath: /tmp/creatorpay-worker-ready
      FirebaseMessaging__Enabled: ${FirebaseMessaging__Enabled:-false}
      FirebaseMessaging__ProjectId: ${FirebaseMessaging__ProjectId:-}
      FirebaseMessaging__ServiceAccountPath: ${FirebaseMessaging__ServiceAccountPath:-}
    depends_on: { postgres: { condition: service_healthy } }
    volumes: [creatorpay-data-protection-keys:/app/data/data-protection-keys]
    networks: [backend]
  web:
    build:
      context: .
      dockerfile: src/CreatorPay.Web/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080}"
        VITE_FIREBASE_API_KEY: "${VITE_FIREBASE_API_KEY:-}"
        VITE_FIREBASE_AUTH_DOMAIN: "${VITE_FIREBASE_AUTH_DOMAIN:-}"
        VITE_FIREBASE_PROJECT_ID: "${VITE_FIREBASE_PROJECT_ID:-}"
        VITE_FIREBASE_APP_ID: "${VITE_FIREBASE_APP_ID:-}"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "${VITE_FIREBASE_MESSAGING_SENDER_ID:-}"
        VITE_FIREBASE_VAPID_PUBLIC_KEY: "${VITE_FIREBASE_VAPID_PUBLIC_KEY:-}"
    restart: unless-stopped
    logging: *json-logging
    ports: ["${WEB_PORT:-8081}:8080"]
    depends_on: { api: { condition: service_healthy } }
    networks: [edge]
    healthcheck: { test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"], interval: 15s, timeout: 5s, retries: 5 }
volumes: { creatorpay-postgres-data: {}, creatorpay-deposit-proofs: {}, creatorpay-data-protection-keys: {} }
networks: { backend: { internal: true }, edge: {} }
