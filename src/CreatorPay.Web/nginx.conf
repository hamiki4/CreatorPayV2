server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  location = /healthz { access_log off; return 200 'healthy'; add_header Content-Type text/plain; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location ~ ^/c/[A-Za-z0-9_-]+$ { access_log off; try_files $uri /index.html; }
  location / { try_files $uri /index.html; }
}
