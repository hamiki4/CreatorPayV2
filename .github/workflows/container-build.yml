name: Container build
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  containers:
    runs-on: ubuntu-latest
    strategy: { matrix: { include: [{ name: api, file: src/CreatorPay.Api/Dockerfile }, { name: worker, file: src/CreatorPay.Worker/Dockerfile }, { name: web, file: src/CreatorPay.Web/Dockerfile }] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: "${{ matrix.file }}", push: false, tags: "creatorpay/${{ matrix.name }}:${{ github.sha }}" }
